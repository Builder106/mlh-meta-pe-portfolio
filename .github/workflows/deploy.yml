name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: myportfoliodb
          MYSQL_USER: myportfolio
          MYSQL_PASSWORD: mypassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: myportfoliodb
      MYSQL_USER: myportfolio
      MYSQL_PASSWORD: mypassword
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Smoke test
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSH_IP: ${{ secrets.SSH_IP }}
      SSH_USER: ${{ secrets.SSH_USER }}
      PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          ssh-keyscan -H "$SSH_IP" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host my-vps
            HostName $SSH_IP
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key.pem
            StrictHostKeyChecking yes
          EOF

      - name: Deploy site
        env:
          PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}
        run: |
          ssh my-vps "PROJECT_ROOT='$PROJECT_ROOT' bash -c '
            set -e
            mkdir -p \"$(dirname \"$PROJECT_ROOT\")\"
            if [ ! -d \"$PROJECT_ROOT/.git\" ]; then
              echo \"Project directory not found, cloning repo...\"
              git clone https://github.com/Builder106/MLH-Meta-PE-Portfolio.git \"$PROJECT_ROOT\"
            else
              echo \"Project directory exists, pulling latest...\"
              cd \"$PROJECT_ROOT\" && git fetch && git reset origin/main --hard
            fi
            cd \"$PROJECT_ROOT\" && ./redeploy-site.sh
          '"

      - name: Notify Discord on success
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: curl -s -X POST "$DISCORD_WEBHOOK" -d "content=🚀 Deployment Successful"

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: curl -s -X POST "$DISCORD_WEBHOOK" -d "content=🚨 Deployment Failed"
