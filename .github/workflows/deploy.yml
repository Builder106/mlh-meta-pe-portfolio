name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: myportfoliodb
          MYSQL_USER: myportfolio
          MYSQL_PASSWORD: mypassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: myportfoliodb
      MYSQL_USER: myportfolio
      MYSQL_PASSWORD: mypassword
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Smoke test
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSH_IP: ${{ secrets.SSH_IP }}
      SSH_USER: ${{ secrets.SSH_USER }}
      PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}
    steps:
      - name: Configure SSH
        if: env.SSH_IP != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          ssh-keyscan -T 10 -H "$SSH_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config << EOF
          Host my-vps
            HostName $SSH_IP
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key.pem
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy site
        if: env.SSH_IP != ''
        env:
          PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}
          URL: ${{ secrets.URL }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          ssh my-vps "PROJECT_ROOT='$PROJECT_ROOT' bash -s" << 'REMOTE_SCRIPT'
            set -e
            mkdir -p "$(dirname "$PROJECT_ROOT")"
            if [ ! -d "$PROJECT_ROOT/.git" ]; then
              echo "Project directory not found, cloning repo..."
              git clone https://github.com/Builder106/MLH-Meta-PE-Portfolio.git "$PROJECT_ROOT"
            else
              echo "Project directory exists, pulling latest..."
              cd "$PROJECT_ROOT" && git fetch && git reset origin/main --hard
            fi

            # Create .env file from env vars passed by GitHub Actions
            {
              echo "URL=$URL"
              echo "MYSQL_HOST=$MYSQL_HOST"
              echo "MYSQL_PORT=$MYSQL_PORT"
              echo "MYSQL_DATABASE=$MYSQL_DATABASE"
              echo "MYSQL_USER=$MYSQL_USER"
              echo "MYSQL_PASSWORD=$MYSQL_PASSWORD"
              echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
              echo "CERTBOT_EMAIL=$CERTBOT_EMAIL"
              echo "HEALTHCHECKS_URL=$HEALTHCHECKS_URL"
            } > "$PROJECT_ROOT/.env"

            cd "$PROJECT_ROOT" && ./redeploy-site.sh
          REMOTE_SCRIPT

      - name: Notify Discord on success
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: curl -s -X POST "$DISCORD_WEBHOOK" -d "content=🚀 Deployment Successful"

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: curl -s -X POST "$DISCORD_WEBHOOK" -d "content=🚨 Deployment Failed"